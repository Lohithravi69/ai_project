name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_dev_os
          POSTGRES_USER: ai_dev_os
          POSTGRES_PASSWORD: ai_dev_os_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy backend --ignore-missing-imports
        continue-on-error: true

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+asyncpg://ai_dev_os:ai_dev_os_password@localhost:5432/ai_dev_os
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest backend/tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint TypeScript
        run: |
          cd frontend
          npm run lint
        continue-on-error: true

      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: |
          cd frontend
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: ai-dev-os:backend-latest

      - name: Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: ai-dev-os:frontend-latest

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_dev_os
          POSTGRES_USER: ai_dev_os
          POSTGRES_PASSWORD: ai_dev_os_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://ai_dev_os:ai_dev_os_password@localhost:5432/ai_dev_os
          REDIS_URL: redis://localhost:6379/0
          OLLAMA_BASE_URL: http://localhost:11434
        run: |
          pytest backend/tests/test_integration.py -v --tb=short -m integration
        continue-on-error: true
